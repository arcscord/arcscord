name: Stage npm release

on:
  push:
    tags:
      - "arcscord@v*"
      - "@arcscord/*@v*"
      - "create-arcscord-bot@v*"

concurrency:
  group: npm-stage-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage:
    name: Validate, build, and stage
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.8.0

      - name: Use Node.js v24.11.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Resolve and validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release/resolve-tag.mts --tag "$RELEASE_TAG"

      - name: Verify tagged commit belongs to main
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/release/verify-main.mts --sha "$RELEASE_SHA"

      - name: Install staging-capable npm CLI
        run: |
          npm install --global npm@11.15.0
          npm --version

      - name: Refuse an existing npm version
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/release/check-npm-version.mts --package "$PACKAGE_NAME" --version "$PACKAGE_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean build artifacts
        run: pnpm clean

      - name: Build code
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Lint code
        run: pnpm lint --fix=false

      - name: Check unused code
        run: pnpm knip

      - name: Typecheck code
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build documentation
        run: pnpm docs:build

      - name: Verify committed release API snapshots
        run: pnpm docs:check-release

      - name: Pack the selected package
        id: pack
        env:
          PACKAGE_DIRECTORY: ${{ steps.release.outputs.package_dir }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/release/pack.mts --directory "$PACKAGE_DIRECTORY" --package "$PACKAGE_NAME" --version "$PACKAGE_VERSION"

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-release-candidate-${{ github.run_id }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

      - name: Stage package on npm
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm stage publish "$TARBALL" --access public --tag "$DIST_TAG"

      - name: Write release summary
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
        run: node scripts/release/write-summary.mts
