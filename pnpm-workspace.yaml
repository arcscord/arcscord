minimumReleaseAgeExcludePrune: true

minimumReleaseAgeExclude:
  - "@arcscord/discord-ui-core@0.2.0"
  - "@arcscord/discord-ui@0.3.0"
shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - detect-port@1.6.1
  - semver@6.3.1

packages:
  - "packages/*"
  - "test/*"
  - website

overrides:
  # Docusaurus 3.10.2 still declares Tinypool 1.x.
  "@docusaurus/core@3.10.2>tinypool": 2.1.2
  # TypeDoc 0.28 still calls Minimatch.matchOne from minimatch 10.
  "@typescript-eslint/typescript-estree>minimatch@^10.0.0": ^11.0.1
  ansi-regex: ^5.0.1
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=5 <5.0.12: ^5.0.12
  colord: ^2.9.4
  eslint-plugin-command: 3.5.3
  fast-uri@^3.0.0: ^3.1.9
  fast-uri@^4.0.0: ^4.2.3
  joi: ^17.13.9
  js-yaml: ^4.3.2
  katex@^0.16.0: 0.18.10
  lodash-es: ^4.17.24
  minimist: ^1.2.8
  nanoid@3.3.16: 3.3.18
  qs: ^6.16.1
  serialize-javascript: ^7.1.3
  svgo: ^3.3.5
  uuid: ^11.1.1
  webpack-dev-middleware: 7.4.5

onlyBuiltDependencies:
  - "@prisma/engines"
  - better-sqlite3
  - prisma
peerDependencyRules:
  allowedVersions:
    tsconfck>typescript: "6"

allowBuilds:
  core-js: false
  esbuild: true
  sharp: true
