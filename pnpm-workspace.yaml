minimumReleaseAgeExcludePrune: true

shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
  - detect-port@1.6.1
  - semver@6.3.1

packages:
  - "packages/*"
  - "test/*"
  - website

overrides:
  ansi-regex: ^5.0.1
  brace-expansion@1.1.16: 1.1.18
  brace-expansion@5.0.8: 5.0.9
  colord: ^2.9.4
  dompurify@3.4.12: 3.4.13
  eslint-plugin-command: 3.5.3
  fast-uri@^3.0.0: ^3.1.6
  fast-uri@^4.0.0: ^4.1.3
  joi: ^17.13.6
  js-yaml: ^4.3.2
  lodash-es: ^4.17.24
  minimist: ^1.2.8
  nanoid@3.3.16: 3.3.18
  qs: ^6.16.0
  serialize-javascript: ^7.0.5
  svgo: ^3.3.5
  uuid: ^11.1.1
  webpack-dev-middleware: 7.4.5

onlyBuiltDependencies:
  - "@prisma/engines"
  - better-sqlite3
  - prisma
peerDependencyRules:
  allowedVersions:
    tsconfck>typescript: "6"

allowBuilds:
  core-js: false
  esbuild: true
  sharp: true
